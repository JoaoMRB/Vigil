<!doctype html>
<!-- Source of src/og.png (1200x630), the picture shown when a link to the site is shared. To redraw it:
     open this file in Chrome headless at 1200x630 and take a screenshot (see site/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vigil social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;600&amp;family=JetBrains+Mono:wght@400&amp;display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #08080A; color: #F5F5F7; }
  body { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 24px; padding: 0 72px; box-sizing: border-box; position: relative; }
  .glow { position: absolute; right: -120px; top: 50%; width: 900px; height: 700px; transform: translateY(-50%); background: radial-gradient(closest-side, rgba(255,181,71,.22), rgba(0,0,0,0)); }
  .text { position: relative; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #FFB547; margin: 0 0 24px; }
  h1 { margin: 0; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 112px; line-height: .9; letter-spacing: -.055em; }
  .brand { display: flex; align-items: center; gap: 12px; margin-top: 44px; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -.02em; }
  .device { position: relative; }
  .frame { padding: 16px; border-radius: 24px; background: linear-gradient(180deg, #1C1C1F, #0E0E10); border: 1px solid #2A2A2E; box-shadow: 0 40px 80px rgba(0,0,0,.6); }
  .screen { aspect-ratio: 3/2; background: #000; border-radius: 8px; padding: 6% 7%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #8A8A90; }
  .row.bottom { letter-spacing: 0; text-transform: none; color: #A1A1A6; }
  .row.bottom b { color: #FFB547; font-weight: 400; }
  .time { font-family: "Inter Tight", sans-serif; font-weight: 200; font-size: 132px; line-height: .9; letter-spacing: -.06em; text-align: center; font-variant-numeric: tabular-nums; }
  .time span { color: #FFB547; }
  .stand { margin: 0 auto; width: 34%; height: 12px; background: linear-gradient(180deg, #151517, #0B0B0C); border-radius: 0 0 10px 10px; border: 1px solid #1F1F22; border-top: none; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <p class="eyebrow">Vigil for Windows</p>
    <h1>Keeps<br>watch.</h1>
    <div class="brand">
      <svg viewBox="6 10 52 46" width="36" height="32" aria-hidden="true">
        <rect x="8" y="12" width="48" height="32" rx="7.5" fill="none" stroke="#F5F5F7" stroke-width="3.5"/>
        <path d="M14.5 29.5 C20 22.5 26 20.5 32.5 20.5 C40 20.5 46 23 54.5 19.5 C51.5 24 49.5 27 47.5 30 C42.5 34.6 37.5 36.5 32.5 36.5 C26 36.5 20 34.5 14.5 29.5 Z" fill="#F5F5F7"/>
        <circle cx="33" cy="28.8" r="4.1" fill="#FFB547"/>
        <path d="M24.5 53 H39.5" stroke="#F5F5F7" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      Vigil
    </div>
  </div>
  <div class="device">
    <div class="frame">
      <div class="screen">
        <div class="row"><span>Fri 13 Nov</span><span>London 14°</span></div>
        <div class="time">21<span>:</span>47</div>
        <div class="row bottom"><span><b>●</b> CPU 41°C</span><span><b>●</b> GPU 38°C</span><span><b>●</b> RAM 34%</span></div>
      </div>
    </div>
    <div class="stand"></div>
  </div>
</body>
</html>
