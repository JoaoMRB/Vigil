<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Vigil</title>
  <!-- App icon for 32 px and up. The screen is 3:2, the proportions of the 480x320 display. -->
  <defs>
    <linearGradient id="v-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="v-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a1a1a6"/>
    </linearGradient>
    <radialGradient id="v-glass" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#1d1d20"/><stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="v-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v-iris" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#f2f2f5"/><stop offset=".55" stop-color="#9a9aa0"/><stop offset="1" stop-color="#3a3a3e"/>
    </radialGradient>
    <clipPath id="v-opening">
