  <rect width="64" height="64" rx="14.5" fill="url(#v-tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
  <g transform="translate(6.4 6.4) scale(.8)">
    <rect x="8" y="12" width="48" height="32" rx="7.5" fill="url(#v-glass)" stroke="url(#v-bezel)" stroke-width="3.2"/>
    <ellipse cx="32" cy="28.5" rx="18" ry="8.5" fill="url(#v-glow)"/>
