    <path d="M16.5 29.4 C21 24.6 27 22.7 33 22.7 C40 22.8 47.2 25.6 53.4 21.8 C51 24.6 49.4 26.4 47.8 28.4 C44 25.7 39 23.7 33 23.6 C27 23.5 21.6 25.4 16.5 29.4 Z" fill="#ffffff"/>
    <path d="M18 30 C22.8 33.2 27.8 34.4 33 34.4 C38.2 34.4 43 32.6 47.8 28.4" fill="none" stroke="#ffffff" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M25 52.5 H39" stroke="#b9b9be" stroke-width="4" stroke-linecap="round"/>
